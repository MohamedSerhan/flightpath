name: Scrape and deploy to GitHub Pages

# Triggers split intentionally:
#
#   push       → fast deploy of code changes only. Restores the latest
#                cached SQLite, skips the slow scrape steps, builds the
#                UI bundle and ships. Typically lands in ~60–90s.
#
#   schedule   → every 4 hours, full scrape + browser pass + alerts +
#                build + deploy. The slow path that keeps the data
#                fresh. Saves SQLite back to cache for the next run.
#
#   workflow_dispatch → manual; respects the FORCE_SCRAPE input so you
#                can either fast-deploy or full-scrape on demand.
#
# The scrape can't really be "decoupled" from the deploy because the
# data is baked into the static bundle (Vite reads dist/web/data/*.json
# at build time). What we CAN do is skip the scrape entirely on push
# events, since pushes are about code changes. Net result: dev iteration
# is fast, scheduled data refreshes are unchanged.

on:
  push:
    branches: [main, master]
  schedule:
    # Every 4 hours. Adjust if the source rate limits start biting.
    - cron: "17 */4 * * *"
  workflow_dispatch:
    inputs:
      force_scrape:
        description: "Run the full scrape (default: yes)"
        type: boolean
        default: true

# We deploy at most one Pages build at a time. Newer runs cancel
# stale ones to avoid racing the cache restore.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      # Project pages live at <user>.github.io/<repo>/. The repo's runtime
      # name is github.event.repository.name; we prefix with / and trail with /.
      # Custom-domain override: set repo variable CUSTOM_DOMAIN
      # (Settings → Secrets and variables → Actions → Variables) to e.g.
      # "flightpath.is-a.dev" — when set, the site is served from the root
      # of that domain instead of the github.io subpath.
      VITE_BASE: ${{ vars.CUSTOM_DOMAIN && '/' || format('/{0}/', github.event.repository.name) }}
      CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
      # Optional. Set these as repo secrets to enable USAJobs.
      USAJOBS_AUTH_KEY: ${{ secrets.USAJOBS_AUTH_KEY }}
      USAJOBS_USER_AGENT: ${{ secrets.USAJOBS_USER_AGENT }}
      # Optional. Set these as repo secrets to enable the Adzuna aggregator.
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      # Optional. Push-alert channels — both are no-ops without their secrets.
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
      ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
      ALERT_FILTER: ${{ vars.ALERT_FILTER }}
      # `true` for cron + manual-with-flag, `false` for code pushes.
      DO_SCRAPE: >-
        ${{ github.event_name == 'schedule'
          || (github.event_name == 'workflow_dispatch' && inputs.force_scrape == true) }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps (cached)
        # bun's lockfile-respecting install is fast (sub-second when
        # the global cache is hit). The fallback handles fork edge cases.
        run: bun install --frozen-lockfile || bun install

      # SQLite cache. Read on every run so the static export has data;
      # written back only when we scraped, so push deploys don't churn
      # the cache key.
      - name: Restore listings DB cache
        id: cache-db
        uses: actions/cache@v4
        with:
          path: flightpath.db
          key: flightpath-db-${{ github.run_id }}
          restore-keys: |
            flightpath-db-

      - name: Run migrations
        run: bun run db:migrate

      - name: Scrape HTTP sources
        if: ${{ env.DO_SCRAPE == 'true' }}
        run: bun run scrape

      # Browser-pass + Chromium install were dropped 2026-05 — every
      # remaining source works over plain HTTP / curl. Saves ~45s and
      # removes the only flaky step from the pipeline.

      # Alerts only after a real scrape — push deploys don't add new
      # listings, so there's nothing to alert on.
      - name: Send alerts
        if: ${{ env.DO_SCRAPE == 'true' }}
        run: bun run alert
        continue-on-error: true

      - name: Build static site (with embedded data bundle)
        run: bun run build:static

      # GitHub Pages reads CNAME from the deployed artifact root and routes
      # the custom domain to it. Only ship the file when CUSTOM_DOMAIN is
      # set; otherwise the github.io subpath stays the canonical URL.
      - name: Write CNAME for custom domain
        if: ${{ env.CUSTOM_DOMAIN != '' }}
        run: echo "$CUSTOM_DOMAIN" > dist/web/CNAME

      # Save the cache only when we scraped — push deploys don't change
      # the data and shouldn't bump the cache key.
      - name: Save listings DB cache
        if: ${{ env.DO_SCRAPE == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: flightpath.db
          key: flightpath-db-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  deploy:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
