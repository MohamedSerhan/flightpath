name: Scrape and deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  schedule:
    # Every 4 hours. Adjust if the source rate limits start biting.
    - cron: "17 */4 * * *"
  workflow_dispatch: {}

# We deploy at most one Pages build at a time. Newer runs cancel
# stale ones to avoid racing the cache restore.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      # Project pages live at <user>.github.io/<repo>/. The repo's runtime
      # name is github.event.repository.name; we prefix with / and trail with /.
      # Custom-domain override: set repo variable CUSTOM_DOMAIN
      # (Settings → Secrets and variables → Actions → Variables) to e.g.
      # "flightpath.is-a.dev" — when set, the site is served from the root
      # of that domain instead of the github.io subpath.
      VITE_BASE: ${{ vars.CUSTOM_DOMAIN && '/' || format('/{0}/', github.event.repository.name) }}
      CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
      # Optional. Set these as repo secrets to enable USAJobs.
      USAJOBS_AUTH_KEY: ${{ secrets.USAJOBS_AUTH_KEY }}
      USAJOBS_USER_AGENT: ${{ secrets.USAJOBS_USER_AGENT }}
      # Optional. Set these as repo secrets to enable the Adzuna aggregator.
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      # Optional. Push-alert channels — both are no-ops without their secrets.
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
      ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
      ALERT_FILTER: ${{ vars.ALERT_FILTER }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile || bun install

      # Cache the SQLite DB so each run resumes from the last one's state.
      # The cache is keyed by date so it rotates daily — picks up the most
      # recent restore-keys match if today's key doesn't exist yet.
      - name: Restore listings DB cache
        id: cache-db
        uses: actions/cache@v4
        with:
          path: flightpath.db
          key: flightpath-db-${{ github.run_id }}
          restore-keys: |
            flightpath-db-

      - name: Run migrations
        run: bun run db:migrate

      - name: Scrape HTTP sources
        run: bun run scrape

      # Browser-only sources (sites that block plain curl or render via JS).
      # Chromium is ~150MB and adds ~30s to each run — happy trade for the
      # extra coverage. If this step fails we still ship the HTTP scrape.
      - name: Install Chromium for Playwright
        run: bunx playwright install --with-deps chromium

      - name: Scrape browser sources
        run: bun run scrape:browser
        continue-on-error: true

      # Push-alert digest — runs after both scrape passes so it sees the
      # full set of new listings, but before build so its state lands in
      # the cached SQLite. No-op when alert channels aren't configured.
      - name: Send alerts
        run: bun run alert
        continue-on-error: true

      - name: Build static site (with embedded data bundle)
        run: bun run build:static

      # GitHub Pages reads CNAME from the deployed artifact root and routes
      # the custom domain to it. Only ship the file when CUSTOM_DOMAIN is
      # set; otherwise the github.io subpath stays the canonical URL.
      - name: Write CNAME for custom domain
        if: ${{ env.CUSTOM_DOMAIN != '' }}
        run: echo "$CUSTOM_DOMAIN" > dist/web/CNAME

      - name: Save listings DB cache
        uses: actions/cache/save@v4
        with:
          path: flightpath.db
          key: flightpath-db-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  deploy:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
